services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server has no ARM build; Docker Desktop runs it through Rosetta on Apple Silicon.
    platform: linux/amd64
    container_name: riot-mssql
    restart: unless-stopped   # start again whenever Docker Desktop starts
    # Limits so a long collection run can't take over the laptop: 2 of its CPU cores and 3 GB of
    # memory (SQL Server itself is capped at 2 GB in sql/0_setup/03_server_settings.sql).
    cpus: 2
    mem_limit: 3g
    environment:
      # Set MSSQL_ACCEPT_EULA=Y in .env once you have read and accepted the SQL Server licence.
      ACCEPT_EULA: "${MSSQL_ACCEPT_EULA:-N}"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mssql-data:
